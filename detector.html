<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Gatos, Perros y Humanos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        #video {
            display: none;
        }

        #canvas {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        #otrocanvas {
            display: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #resultado {
            text-align: center;
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.85em;
            color: #666;
            text-align: center;
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.ready {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            #resultado {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Detector IA</h1>
        <p class="subtitle">Gatos, Perros y Humanos</p>

        <div id="status" class="status loading">Cargando modelo...</div>

        <video id="video" playsinline autoplay></video>
        <canvas id="canvas" width="400" height="400"></canvas>
        <canvas id="otrocanvas" width="224" height="224"></canvas>

        <div id="resultado">-</div>

        <div class="controls">
            <button id="cambiar-camara" onclick="cambiarCamara()">📷 Cambiar Cámara</button>
        </div>

        <div class="info" id="modelo-info">Preparando...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script>
        const tamano = 400;
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const otrocanvas = document.getElementById("otrocanvas");
        const ctx = canvas.getContext("2d");
        const statusDiv = document.getElementById("status");

        let currentStream = null;
        let facingMode = "user";
        let modelo = null;
        let clases = {};

        // Cargar modelo
        (async () => {
            try {
                console.log("🔄 Cargando modelo...");
                statusDiv.textContent = "Cargando modelo de IA...";

                modelo = await tf.loadLayersModel("modelo_IA/tfjs_model/model.json");
                console.log("✅ Modelo cargado");

                const response = await fetch("modelo_IA/clases.json");
                clases = await response.json();
                console.log("✅ Clases:", clases);

                const outputShape = modelo.outputShape;
                const numClases = outputShape[outputShape.length - 1];

                const clasesNombres = Object.keys(clases).join(", ");
                document.getElementById("modelo-info").innerHTML =
                    `✅ Modelo listo: ${numClases} clases (${clasesNombres})`;

                statusDiv.textContent = "✅ Modelo listo - Iniciando cámara...";
                statusDiv.className = "status ready";

                // Iniciar cámara
                mostrarCamara();
            } catch (error) {
                console.error("❌ Error:", error);
                statusDiv.textContent = "❌ Error al cargar el modelo";
                statusDiv.className = "status error";
            }
        })();

        function mostrarCamara() {
            const opciones = {
                audio: false,
                video: {
                    facingMode: facingMode,
                    width: { ideal: tamano },
                    height: { ideal: tamano }
                }
            };

            navigator.mediaDevices.getUserMedia(opciones)
                .then(stream => {
                    currentStream = stream;
                    video.srcObject = currentStream;
                    statusDiv.textContent = "🎥 Cámara activa - Detectando...";
                    procesarCamara();
                    predecir();
                })
                .catch(error => {
                    console.error("Error de cámara:", error);
                    statusDiv.textContent = "❌ No se pudo acceder a la cámara";
                    statusDiv.className = "status error";
                });
        }

        function cambiarCamara() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            facingMode = facingMode === "user" ? "environment" : "user";
            mostrarCamara();
        }

        function procesarCamara() {
            ctx.drawImage(video, 0, 0, tamano, tamano, 0, 0, tamano, tamano);
            setTimeout(procesarCamara, 20);
        }

        function predecir() {
            if (modelo != null && Object.keys(clases).length > 0) {
                // Redimensionar imagen
                resample_single(canvas, 224, 224, otrocanvas);

                // Obtener datos de imagen
                const ctx2 = otrocanvas.getContext("2d");
                const imgData = ctx2.getImageData(0, 0, 224, 224);

                // Preparar datos RGB
                const arr = [];
                for (let i = 0; i < 224; i++) {
                    const fila = [];
                    for (let j = 0; j < 224; j++) {
                        const idx = (i * 224 + j) * 4;
                        const rojo = imgData.data[idx] / 255.0;
                        const verde = imgData.data[idx + 1] / 255.0;
                        const azul = imgData.data[idx + 2] / 255.0;
                        fila.push([rojo, verde, azul]);
                    }
                    arr.push(fila);
                }

                // Crear tensor y predecir
                const tensor = tf.tensor4d([arr]);
                const resultado = modelo.predict(tensor).dataSync();

                // Encontrar clase con mayor probabilidad
                let maxIdx = 0;
                let maxVal = resultado[0];
                for (let i = 1; i < resultado.length; i++) {
                    if (resultado[i] > maxVal) {
                        maxVal = resultado[i];
                        maxIdx = i;
                    }
                }

                // Obtener nombre de clase
                let respuesta = "";
                for (const clase in clases) {
                    if (clases[clase] === maxIdx) {
                        respuesta = clase.charAt(0).toUpperCase() + clase.slice(1);
                        break;
                    }
                }

                // Mostrar resultado
                const porcentaje = (maxVal * 100).toFixed(1);
                const emoji = maxIdx === 0 ? "🐱" : maxIdx === 1 ? "👤" : "🐶";
                document.getElementById("resultado").innerHTML =
                    `${emoji} ${respuesta}<br><span style="font-size: 0.5em">${porcentaje}%</span>`;

                // Liberar memoria
                tensor.dispose();
            }

            setTimeout(predecir, 150);
        }

        // Función de redimensionamiento Hermite
        function resample_single(canvas, width, height, resize_canvas) {
            const width_source = canvas.width;
            const height_source = canvas.height;
            width = Math.round(width);
            height = Math.round(height);

            const ratio_w = width_source / width;
            const ratio_h = height_source / height;
            const ratio_w_half = Math.ceil(ratio_w / 2);
            const ratio_h_half = Math.ceil(ratio_h / 2);

            const ctx = canvas.getContext("2d");
            const ctx2 = resize_canvas.getContext("2d");
            const img = ctx.getImageData(0, 0, width_source, height_source);
            const img2 = ctx2.createImageData(width, height);
            const data = img.data;
            const data2 = img2.data;

            for (let j = 0; j < height; j++) {
                for (let i = 0; i < width; i++) {
                    const x2 = (i + j * width) * 4;
                    let weight = 0;
                    let weights = 0;
                    let weights_alpha = 0;
                    let gx_r = 0;
                    let gx_g = 0;
                    let gx_b = 0;
                    let gx_a = 0;
                    const center_y = (j + 0.5) * ratio_h;
                    const yy_start = Math.floor(j * ratio_h);
                    const yy_stop = Math.ceil((j + 1) * ratio_h);

                    for (let yy = yy_start; yy < yy_stop; yy++) {
                        const dy = Math.abs(center_y - (yy + 0.5)) / ratio_h_half;
                        const center_x = (i + 0.5) * ratio_w;
                        const w0 = dy * dy;
                        const xx_start = Math.floor(i * ratio_w);
                        const xx_stop = Math.ceil((i + 1) * ratio_w);

                        for (let xx = xx_start; xx < xx_stop; xx++) {
                            const dx = Math.abs(center_x - (xx + 0.5)) / ratio_w_half;
                            const w = Math.sqrt(w0 + dx * dx);
                            if (w >= 1) continue;

                            weight = 2 * w * w * w - 3 * w * w + 1;
                            const pos_x = 4 * (xx + yy * width_source);

                            gx_a += weight * data[pos_x + 3];
                            weights_alpha += weight;

                            if (data[pos_x + 3] < 255)
                                weight = weight * data[pos_x + 3] / 250;

                            gx_r += weight * data[pos_x];
                            gx_g += weight * data[pos_x + 1];
                            gx_b += weight * data[pos_x + 2];
                            weights += weight;
                        }
                    }

                    data2[x2] = gx_r / weights;
                    data2[x2 + 1] = gx_g / weights;
                    data2[x2 + 2] = gx_b / weights;
                    data2[x2 + 3] = gx_a / weights_alpha;
                }
            }

            ctx2.putImageData(img2, 0, 0);
        }
    </script>
</body>
</html>
