<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <title>Detector: Perros, Gatos y Humanos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
      #resultado {
        font-weight: bold;
        font-size: 6rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    
    <main>
      <div class="px-4 py-2 my-2 text-center border-bottom">
        <img class="d-block mx-auto mb-2" src="LogotipoV2-Simple.png" alt="" width="80" height="80">
        <h1 class="display-5 fw-bold">Detector: Perros, Gatos y Humanos</h1>
        <div class="col-lg-6 mx-auto">
          <p class="lead mb-0">Clasificaci&oacute;n de im&aacute;genes (Perro, Gato o Humano) usando la c&aacute;mara web utilizando Tensorflow.js</p>
          <p class="lead mb-4">Revisa <a href="https://youtube.com/RingaTech">mi canal</a> para este y otros proyectos</p>
        </div>
      </div>

      <div class="b-example-divider"></div>

      <div class="container mt-5">
        <div class="row">
          <div class="col-12 col-md-4 offset-md-4 text-center">
            <video id="video" playsinline autoplay style="width: 1px;"></video>
            <button class="btn btn-primary mb-2" id="cambiar-camara" onclick="cambiarCamara();">Cambiar camara</button>
            <canvas id="canvas" width="400" height="400" style="max-width: 100%;"></canvas>
            <canvas id="otrocanvas" width="224" height="224" style="display: none"></canvas>
            <div id="resultado"></div>
            <div id="modelo-info" style="font-size: 0.8rem; color: #666; margin-top: 10px;"></div>            
          </div>
        </div>
      </div>

      <div class="b-example-divider"></div>

      <div class="bg-dark text-secondary mt-5 px-4 py-2 text-center">
        <div class="py-5">
          <h1 class="display-5 fw-bold text-white">Ringa Tech</h1>
          <div class="col-lg-6 mx-auto">
            <p class="fs-5 mb-4">Revisa <a href="https://youtube.com/RingaTech">mi canal</a> para videos de inteligencia artificial, programaci&oacute;n, etc.</p>
          </div>
        </div>
      </div>

      <div class="b-example-divider mb-0"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js">

  <script type="text/javascript">

    var tamano = 400;
    var video = document.getElementById("video");
    var canvas = document.getElementById("canvas");
    var otrocanvas = document.getElementById("otrocanvas");
    var ctx = canvas.getContext("2d");
    var currentStream = null;
    var facingMode = "user";

    var modelo = null;
    var clases = {};

    (async() => {
      console.log("🔄 Cargando modelo desde: modelo_IA/tfjs_model/model.json");
      modelo = await tf.loadLayersModel("modelo_IA/tfjs_model/model.json");
      console.log("✅ Modelo cargado exitosamente");
      console.log("📊 Arquitectura del modelo:", modelo.summary());

      // Verificar la forma de salida del modelo
      const outputShape = modelo.outputShape;
      console.log("🎯 Forma de salida del modelo:", outputShape);
      const numClases = outputShape[outputShape.length - 1];
      console.log("🔢 Número de clases:", numClases);

      // Cargar clases
      console.log("🔄 Cargando clases desde: modelo_IA/clases.json");
      const response = await fetch("modelo_IA/clases.json");
      clases = await response.json();
      console.log("✅ Clases cargadas:", clases);
      console.log("📝 Número de clases en archivo:", Object.keys(clases).length);

      // Mostrar info en la página
      const clasesNombres = Object.keys(clases).join(", ");
      document.getElementById("modelo-info").innerHTML =
        `Modelo: ${numClases} clases (${clasesNombres}) - MobileNetV2`;
    })();

    window.onload = function() {
      mostrarCamara();
    }

    function mostrarCamara() {
      var opciones = {
        audio: false,
        video: {
          width: tamano, height: tamano
        }
      }

      if (navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia(opciones)
            .then(function(stream) {
              currentStream = stream;
              video.srcObject = currentStream;
              procesarCamara();
              predecir();
            })
            .catch(function(err) {
              alert("No se pudo utilizar la camara :(");
              console.log(err);
              alert(err);
            })
      } else {
        alert("No existe la funcion getUserMedia");
      }
    }

    function cambiarCamara() {
          if (currentStream) {
              currentStream.getTracks().forEach(track => {
                  track.stop();
              });
          }

          facingMode = facingMode == "user" ? "environment" : "user";

          var opciones = {
              audio: false,
              video: {
                  facingMode: facingMode, width: tamano, height: tamano
              }
          };


          navigator.mediaDevices.getUserMedia(opciones)
              .then(function(stream) {
                  currentStream = stream;
                  video.srcObject = currentStream;
              })
              .catch(function(err) {
                  console.log("Oops, hubo un error", err);
              })
      }

    function procesarCamara() {
      ctx.drawImage(video, 0, 0, tamano, tamano, 0, 0, tamano, tamano);
      setTimeout(procesarCamara, 20);
    }

    function predecir() {
      if (modelo != null && Object.keys(clases).length > 0) {
        resample_single(canvas, 224, 224, otrocanvas);

        // Hacer la predicción con el nuevo modelo
        var ctx2 = otrocanvas.getContext("2d");
        var imgData = ctx2.getImageData(0, 0, 224, 224);

        // Procesar imagen RGB (sin convertir a escala de grises)
        var arr = [];
        for (var i = 0; i < 224; i++) {
          var fila = [];
          for (var j = 0; j < 224; j++) {
            var idx = (i * 224 + j) * 4;
            var rojo = imgData.data[idx] / 255.0;
            var verde = imgData.data[idx + 1] / 255.0;
            var azul = imgData.data[idx + 2] / 255.0;
            fila.push([rojo, verde, azul]);
          }
          arr.push(fila);
        }

        // Crear tensor [1, 224, 224, 3]
        var tensor = tf.tensor4d([arr]);

        // Predecir
        var resultado = modelo.predict(tensor).dataSync();

        // Log para depuración (solo cada 30 predicciones para no saturar)
        if (Math.random() < 0.03) {
          console.log("🎲 Predicción:", Array.from(resultado).map(v => v.toFixed(3)));
        }

        // Encontrar la clase con mayor probabilidad
        var maxIdx = 0;
        var maxVal = resultado[0];
        for (var i = 1; i < resultado.length; i++) {
          if (resultado[i] > maxVal) {
            maxVal = resultado[i];
            maxIdx = i;
          }
        }

        // Obtener nombre de la clase
        var respuesta = "";
        for (var clase in clases) {
          if (clases[clase] === maxIdx) {
            respuesta = clase.charAt(0).toUpperCase() + clase.slice(1);
            break;
          }
        }

        // Mostrar resultado con probabilidad
        var porcentaje = (maxVal * 100).toFixed(1);
        document.getElementById("resultado").innerHTML = respuesta + " (" + porcentaje + "%)";

        // Liberar memoria del tensor
        tensor.dispose();
      }

      setTimeout(predecir, 150);
    }

    /**
       * Hermite resize - fast image resize/resample using Hermite filter. 1 cpu version!
       * 
       * @param {HtmlElement} canvas
       * @param {int} width
       * @param {int} height
       * @param {boolean} resize_canvas if true, canvas will be resized. Optional.
       * Cambiado por RT, resize canvas ahora es donde se pone el chiqitillllllo
       */
      function resample_single(canvas, width, height, resize_canvas) {
          var width_source = canvas.width;
          var height_source = canvas.height;
          width = Math.round(width);
          height = Math.round(height);

          var ratio_w = width_source / width;
          var ratio_h = height_source / height;
          var ratio_w_half = Math.ceil(ratio_w / 2);
          var ratio_h_half = Math.ceil(ratio_h / 2);

          var ctx = canvas.getContext("2d");
          var ctx2 = resize_canvas.getContext("2d");
          var img = ctx.getImageData(0, 0, width_source, height_source);
          var img2 = ctx2.createImageData(width, height);
          var data = img.data;
          var data2 = img2.data;

          for (var j = 0; j < height; j++) {
              for (var i = 0; i < width; i++) {
                  var x2 = (i + j * width) * 4;
                  var weight = 0;
                  var weights = 0;
                  var weights_alpha = 0;
                  var gx_r = 0;
                  var gx_g = 0;
                  var gx_b = 0;
                  var gx_a = 0;
                  var center_y = (j + 0.5) * ratio_h;
                  var yy_start = Math.floor(j * ratio_h);
                  var yy_stop = Math.ceil((j + 1) * ratio_h);
                  for (var yy = yy_start; yy < yy_stop; yy++) {
                      var dy = Math.abs(center_y - (yy + 0.5)) / ratio_h_half;
                      var center_x = (i + 0.5) * ratio_w;
                      var w0 = dy * dy; //pre-calc part of w
                      var xx_start = Math.floor(i * ratio_w);
                      var xx_stop = Math.ceil((i + 1) * ratio_w);
                      for (var xx = xx_start; xx < xx_stop; xx++) {
                          var dx = Math.abs(center_x - (xx + 0.5)) / ratio_w_half;
                          var w = Math.sqrt(w0 + dx * dx);
                          if (w >= 1) {
                              //pixel too far
                              continue;
                          }
                          //hermite filter
                          weight = 2 * w * w * w - 3 * w * w + 1;
                          var pos_x = 4 * (xx + yy * width_source);
                          //alpha
                          gx_a += weight * data[pos_x + 3];
                          weights_alpha += weight;
                          //colors
                          if (data[pos_x + 3] < 255)
                              weight = weight * data[pos_x + 3] / 250;
                          gx_r += weight * data[pos_x];
                          gx_g += weight * data[pos_x + 1];
                          gx_b += weight * data[pos_x + 2];
                          weights += weight;
                      }
                  }
                  data2[x2] = gx_r / weights;
                  data2[x2 + 1] = gx_g / weights;
                  data2[x2 + 2] = gx_b / weights;
                  data2[x2 + 3] = gx_a / weights_alpha;
              }
          }


          ctx2.putImageData(img2, 0, 0);
      }
  </script>
  </body>
</html>
